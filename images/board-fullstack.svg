<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" fill="none">
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <style>
      .title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        fill: #f0f6fc;
        transition: fill 0.2s ease;
      }
      .description {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        fill: #8b949e;
      }
      .date {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        font-weight: bold;
        fill: #8b949e;
      }
      .badge-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .row-bg {
        fill: #0d1117;
        transition: fill 0.2s ease;
      }
      .container:hover .row-bg {
        fill: #1c2128;
      }
      .container:hover .title {
        fill: #58a6ff;
      }
    </style>
  </defs>

  <g class="container" cursor="pointer">
    <!-- Background -->
    <rect class="row-bg" width="800" height="80" />
    
    <!-- Bottom Border -->
    <line x1="0" y1="79.5" x2="800" y2="79.5" stroke="#21262d" stroke-width="1"/>
    
    <!-- Category Badge -->
    <rect x="30" y="22" width="110" height="36" rx="8" fill="url(#blue-grad)" />
    <text x="85" y="44" class="badge-text" text-anchor="middle">FULLSTACK</text>
    
    <!-- Title & Description -->
    <text x="170" y="37" class="title">WebSocket을 활용한 실시간 동기화 아키텍처 설계</text>
    <text x="170" y="58" class="description">React, Node.js, WebSocket 기반 동기화 및 백엔드 스케일아웃 기법</text>
    
    <!-- Date -->
    <text x="710" y="46" class="date" text-anchor="middle">2026.05.25</text>
  </g>
</svg>
