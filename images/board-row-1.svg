<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" fill="none">
  <defs>
    <style>
      .title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        fill: #f0f6fc;
        transition: fill 0.2s ease;
      }
      .description {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        fill: #8b949e;
      }
      .date {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        font-weight: bold;
        fill: #8b949e;
      }
      .badge-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .row-bg {
        fill: #161b22;
        transition: fill 0.2s ease;
      }
      .container:hover .row-bg {
        fill: #1c2128;
      }
      .container:hover .title {
        fill: #58a6ff;
      }
    </style>
  </defs>

  <g class="container" cursor="pointer">
    <path class="row-bg" d="M 0 0 L 800 0 L 800 80 L 0 80 Z" />
    
    <line x1="0" y1="79.5" x2="800" y2="79.5" stroke="#21262d" stroke-width="1"/>
    
    <rect x="30" y="22" width="110" height="36" rx="8" fill="#ec4899" />
    <text x="85" y="44" class="badge-text" text-anchor="middle">AI/ML</text>
    
    <text x="170" y="37" class="title">트랜스포머(Transformer) 모델의 어텐션 메커니즘</text>
    <text x="170" y="58" class="description">자연어 처리의 혁신, 핵심 원리 파헤치기</text>
    
    <text x="710" y="46" class="date" text-anchor="middle">2023.11.02</text>
  </g>
</svg>