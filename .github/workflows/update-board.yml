name: Update SVG Board

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run SVG Generator Script
        run: node scripts/generate-board.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update bulletin board SVGs and README"
          file_pattern: "images/*.svg README.md"
          branch: main
